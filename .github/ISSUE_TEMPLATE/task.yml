name: "Task / Feature"
description: "Implement a function from docs/function-list.md"
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Access & Account"
        - "Browsing & Buying"
        - "Products"
        - "Orders & Payments"
        - "Shop Administration"
        - "Platform"
        - "Database & Infrastructure"
    validations:
      required: true
  - type: input
    id: function-id
    attributes:
      label: Function ID
      description: "From docs/function-list.md"
      placeholder: "e.g., EB-007"
  - type: input
    id: estimate
    attributes:
      label: Estimate (Days)
      placeholder: "e.g., 2 days"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What to build and anything not obvious from the function list."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: "- [ ] \n- [ ] "
    validations:
      required: true
